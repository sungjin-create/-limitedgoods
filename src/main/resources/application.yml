spring:
  application:
    name: limitedgoods

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true

  data:
    redis:
      timeout: 6000ms

server:
  tomcat:
    threads:
      max: 200

app:
  auth:
    refresh-token:
      expiration: ${REFRESH_TOKEN_EXPIRATION:7d}
    refresh-cookie:
      name: refresh_token
      same-site: Lax
      path: /api/user
      max-age: 7d

jwt:
  access-expiration: 15m

management:
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include: health,info

queue:
  admission:
    bypass-enabled: false
    active-window: ${QUEUE_ADMISSION_ACTIVE_WINDOW:40}
  cleanup:
    delay-ms: 10000

payment:
  finalize:
    delay-ms: 30000
