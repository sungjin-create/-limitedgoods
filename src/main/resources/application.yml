spring:
  application:
    name: limitedgoods

  datasource:
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true

  data:
    redis:
      timeout: 6000ms

server:
  tomcat:
    threads:
      max: 200

jwt:
  access-expiration: 15m

management:
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include: health,info,prometheus

queue:
  admission:
    bypass-enabled: false
    active-window: ${QUEUE_ADMISSION_ACTIVE_WINDOW:50}
  cleanup:
    delay-ms: 10000
