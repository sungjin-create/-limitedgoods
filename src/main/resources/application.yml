spring:
  application:
    name: limitedgoods

  datasource:
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true

  data:
    redis:
      timeout: 6000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        compression.type: zstd
        delivery.timeout.ms: 30000

    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

server:
  tomcat:
    threads:
      max: 200

app:
  auth:
    refresh-token:
      expiration: ${REFRESH_TOKEN_EXPIRATION:7d}
    refresh-cookie:
      name: refresh_token
      same-site: Lax
      path: /api/user
      max-age: 7d
  kafka:
    topics:
      order-lifecycle:
        name: orders.lifecycle.v1
        partitions: 3
        replicas: 1
    consumer:
      notification:
        group-id: limitedgoods-notification

jwt:
  access-expiration: 15m

management:
  server:
    port: 9091

  endpoints:
    web:
      exposure:
        include: health,info

queue:
  admission:
    bypass-enabled: false
    active-window: ${QUEUE_ADMISSION_ACTIVE_WINDOW:40}
  cleanup:
    delay-ms: 10000

payment:
  finalize:
    delay-ms: 30000

outbox:
  publish:
    delay-ms: 500
    batch-size: 20
    send-timeout: 10s
    max-attempts: 10
    initial-backoff: 1s
    max-backoff: 5m