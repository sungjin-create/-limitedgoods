spring:
  datasource:
    hikari:
      maximum-pool-size: ${LOADTEST_DB_POOL_SIZE:10}
      connection-timeout: 3000
      validation-timeout: 1000

  data:
    redis:
      timeout: 3000ms

server:
  tomcat:
    threads:
      max: ${LOADTEST_TOMCAT_MAX_THREADS:200}

jwt:
  access-expiration: ${JWT_ACCESS_EXPIRATION:30m}

queue:
  admission:
    bypass-enabled: ${QUEUE_ADMISSION_BYPASS_ENABLED:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
